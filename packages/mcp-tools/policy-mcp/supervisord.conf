[supervisord]
nodaemon=true
user=root

[program:opa]
command=/usr/local/bin/opa run --server --bundle /app/bundle.tar.gz --addr :8181 --log-level info
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:policy-mcp]
command=/usr/local/bin/uvicorn policy-mcp.server:app --host 0.0.0.0 --port 8080
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
